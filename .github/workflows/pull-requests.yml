name: Pull requests
on:
  push:
    branches-ignore:
      - 'main'

jobs:
  tests-dotnet8:
    name: Test dotnet 8.0
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # Every job installs all four SDKs: the projects multi-target net8.0 through net11.0, so the
      # newest SDK must be present to evaluate TargetFrameworks even when only one is built here.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Set version
        run: echo "VERSION=1.0.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Test
        run: dotnet test -f net8.0

  tests-dotnet9:
    name: Test dotnet 9.0
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Set version
        run: echo "VERSION=1.0.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Test
        run: dotnet test -f net9.0

  tests-dotnet10:
    name: Test dotnet 10.0
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Set version
        run: echo "VERSION=1.0.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Test
        run: dotnet test -f net10.0

  tests-dotnet11:
    name: Test dotnet 11.0
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Set version
        run: echo "VERSION=1.0.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Test
        run: dotnet test -f net11.0
